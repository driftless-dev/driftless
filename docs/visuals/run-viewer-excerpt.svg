<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Driftless run viewer excerpt</title>
  <desc id="desc">Run viewer style panel showing status, metric trend, clusters, scorecard, and attempt log.</desc>
  <rect width="1280" height="720" fill="#070b16"/>
  <text x="72" y="82" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="34" font-weight="800">Run viewer</text>
  <text x="72" y="118" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="18">support_classifier · optimization observability</text>
  <rect x="980" y="62" width="126" height="42" rx="21" fill="#0d2b22" stroke="#46d39a"/>
  <text x="1024" y="90" fill="#46d39a" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="700">pass</text>

  <rect x="72" y="154" width="512" height="230" rx="14" fill="#101827" stroke="#26364f"/>
  <text x="102" y="198" fill="#e5e7eb" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="700">Primary metric by iteration</text>
  <polyline points="118,326 210,312 302,282 394,228 520,210" fill="none" stroke="#6ea8fe" stroke-width="5"/>
  <circle cx="118" cy="326" r="7" fill="#6ea8fe"/><circle cx="210" cy="312" r="7" fill="#6ea8fe"/><circle cx="302" cy="282" r="7" fill="#6ea8fe"/><circle cx="394" cy="228" r="7" fill="#6ea8fe"/><circle cx="520" cy="210" r="7" fill="#43e0c4"/>
  <text x="112" y="354" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">baseline 0.896 -> accepted 1.000</text>

  <rect x="626" y="154" width="582" height="230" rx="14" fill="#101827" stroke="#26364f"/>
  <text x="656" y="198" fill="#e5e7eb" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="700">Failure clusters</text>
  <rect x="668" y="242" width="420" height="26" rx="13" fill="#334155"/>
  <rect x="668" y="242" width="360" height="26" rx="13" fill="#ff6b81"/>
  <rect x="668" y="292" width="420" height="26" rx="13" fill="#334155"/>
  <rect x="668" y="292" width="40" height="26" rx="13" fill="#46d39a"/>
  <text x="656" y="354" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">misclassification clusters shrink to zero</text>

  <rect x="72" y="424" width="512" height="200" rx="14" fill="#101827" stroke="#26364f"/>
  <text x="102" y="468" fill="#e5e7eb" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="700">Scorecard</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
    <text x="104" y="512" fill="#94a3b8">Metric</text><text x="300" y="512" fill="#94a3b8">Current</text><text x="410" y="512" fill="#94a3b8">Final</text>
    <text x="104" y="550" fill="#e5e7eb">F1</text><text x="318" y="550" fill="#e5e7eb">0.896</text><text x="424" y="550" fill="#46d39a">1.000</text>
    <text x="104" y="588" fill="#e5e7eb">Schema err</text><text x="318" y="588" fill="#e5e7eb">0.0%</text><text x="424" y="588" fill="#46d39a">0.0%</text>
  </g>

  <rect x="626" y="424" width="582" height="200" rx="14" fill="#101827" stroke="#26364f"/>
  <text x="656" y="468" fill="#e5e7eb" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="700">Attempt log</text>
  <rect x="656" y="500" width="94" height="30" rx="15" fill="#0d2b22" stroke="#46d39a"/>
  <text x="678" y="521" fill="#46d39a" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">accepted</text>
  <text x="656" y="562" fill="#e5e7eb" font-family="Inter, ui-sans-serif, system-ui" font-size="18">restrict output to the contract's exact label set</text>
  <text x="656" y="596" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">diff +/- 3 · primary 1.000 · passed tuning</text>
