name: "driftless"
description: "Keep models, prompts, and eval data in sync with quality-gated CI updates."
branding:
  icon: "git-pull-request"
  color: "purple"

inputs:
  command:
    description: "driftless subcommand to run (scan, plan, compare, migrate, refine, poll, validate, open-pr, audit-labels, judge-check)."
    required: false
    default: "scan"
  workflow:
    description: "Workflow name (for compare/migrate/validate/open-pr)."
    required: false
    default: ""
  to:
    description: "Target model (for compare/migrate)."
    required: false
    default: ""
  args:
    description: "Extra raw arguments appended to the command (e.g. '--generator fixture')."
    required: false
    default: ""
  version:
    description: "driftless version/spec to install (e.g. '==0.3.6' or a git URL)."
    required: false
    default: "==0.3.6"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install driftless
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        package="driftless"
        case "$INPUT_COMMAND" in
          plan|migrate|refine|poll|judge-check) package="driftless[llm]" ;;
        esac
        if [ -f "pyproject.toml" ] && grep -q 'name = "driftless"' pyproject.toml; then
          if [ "$package" = "driftless[llm]" ]; then
            pip install -e ".[llm]"
          else
            pip install -e .
          fi
        else
          pip install "${package}${INPUT_VERSION}"
        fi

    - name: Run driftless
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_WORKFLOW: ${{ inputs.workflow }}
        INPUT_TO: ${{ inputs.to }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        case "$INPUT_COMMAND" in
          scan|plan|compare|migrate|refine|poll|validate|open-pr|audit-labels|judge-check) ;;
          *)
            echo "::error::Unsupported driftless command: $INPUT_COMMAND"
            exit 2
            ;;
        esac

        cmd=(driftless "$INPUT_COMMAND")
        [ -n "$INPUT_WORKFLOW" ] && cmd+=(--workflow "$INPUT_WORKFLOW")
        [ -n "$INPUT_TO" ] && cmd+=(--to "$INPUT_TO")

        if [ -n "$INPUT_ARGS" ]; then
          args_file="$(mktemp)"
          trap 'rm -f "$args_file"' EXIT
          if ! python -c 'import shlex, sys; [sys.stdout.buffer.write(arg.encode() + b"\0") for arg in shlex.split(sys.argv[1])]' "$INPUT_ARGS" > "$args_file"; then
            echo "::error::Unable to parse the args input"
            exit 2
          fi
          while IFS= read -r -d '' arg; do
            cmd+=("$arg")
          done < "$args_file"
        fi

        echo "Running: ${cmd[*]}"
        "${cmd[@]}"
