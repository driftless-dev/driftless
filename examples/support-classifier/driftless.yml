version: 1
workflows:
  support_classifier:
    description: "Support ticket classification with fixed gold labels."
    model:
      current: gpt-4
      target_candidates:
        - gpt-4o-mini
        - gpt-4o
      env_var: MODEL
      portable: true

    files:
      editable:
        - prompts/classifier.md
      readonly:
        - app/
        - evals/tickets.jsonl
        - evals/gold.jsonl

    run:
      command: python3 -m app.eval_classifier
      input_path: evals/tickets.jsonl
      output_path: evals/outputs.jsonl
      timeout_seconds: 30

    eval:
      id_field: id
      labels_path: evals/gold.jsonl
      label_field: label
      cost_field: cost
      split:
        tuning: 60%
        holdout: 40%

    thresholds:
      min_f1: 0.90
      max_cost_increase: 0.20

    migration:
      max_iterations: 3

