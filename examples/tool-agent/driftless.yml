version: 1
workflows:
  support_agent:
    description: "Tool-using support agent over fixed fixture data."
    model:
      current: gpt-4
      target_candidates:
        - gpt-4o
        - gpt-4o-mini
      env_var: MODEL
      portable: true

    files:
      editable:
        - prompts/planner.md
        - prompts/tool_descriptions.md
      readonly:
        - app/
        - data/orders.jsonl
        - data/policies.json
        - evals/cases.jsonl
        - evals/gold.jsonl

    run:
      command: python3 -m app.eval_agent
      input_path: evals/cases.jsonl
      output_path: evals/outputs.jsonl
      timeout_seconds: 30

    eval:
      id_field: id
      score_field: score
      cost_field: cost
      split:
        tuning: 60%
        holdout: 40%

    thresholds:
      min_score: 0.85
      max_cost_increase: 0.20

    migration:
      max_iterations: 3

