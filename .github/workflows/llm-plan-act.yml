name: LLM plan (deprecation triage)

# Example policy triage workflow for repositories that contain driftless.yml.
# This repository does not have a root application contract, so the workflow is
# manual here. `driftless init-ci --plan` scaffolds a scheduled version in a
# customer project.
#
# Manual runs are dry-run (--act); set create=true to open real PRs/issues.
# Requires driftless.yml + optional .driftless/policy.yml at repository root.
# Run `driftless init-ci --plan` to scaffold the same workflow for your project.
on:
  workflow_dispatch:
    inputs:
      create:
        description: Open PRs/issues (not just preview)
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Plan and act on migration triggers
        uses: driftless-dev/driftless@v0.3.4
        with:
          command: plan
          args: >-
            --act${{ github.event_name == 'workflow_dispatch' && inputs.create && ' --create' || '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
