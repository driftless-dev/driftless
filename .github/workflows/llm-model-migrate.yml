name: LLM model migration

# Manually triggered migration: runs the workflow under the target model,
# repairs prompts/configs where allowed, validates on holdout, and opens a PR
# (or an issue if the migration is blocked).
on:
  workflow_dispatch:
    inputs:
      workflow:
        description: "Workflow name from driftless.yml"
        required: true
      to:
        description: "Target model"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Audit gold labels
        uses: driftless-dev/driftless@v0.3.6
        with:
          command: audit-labels
          workflow: ${{ github.event.inputs.workflow }}
          args: "--fail"

      - name: Attempt migration
        id: migrate
        continue-on-error: true
        uses: driftless-dev/driftless@v0.3.6
        with:
          command: migrate
          workflow: ${{ github.event.inputs.workflow }}
          to: ${{ github.event.inputs.to }}
          args: "--strict-label-audit"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Open migration PR (or issue)
        uses: driftless-dev/driftless@v0.3.6
        with:
          command: open-pr
          workflow: ${{ github.event.inputs.workflow }}
          args: "--create"

      - name: Preserve blocked migration status
        if: steps.migrate.outcome == 'failure'
        run: exit 1
