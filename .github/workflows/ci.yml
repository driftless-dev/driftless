name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Typecheck
        run: mypy

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Validate GitHub Actions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          ACTIONLINT="$(go env GOPATH)/bin/actionlint"
          "$ACTIONLINT"
          GENERATED="$(mktemp -d)"
          driftless init-ci \
            --contract tests/fixtures/adoption-app/driftless.yml \
            --out-dir "$GENERATED" \
            --setup-command "pip install -e ."
          "$ACTIONLINT" "$GENERATED"/*.yml

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --cov-fail-under=78

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate model catalog schema
        run: python tools/refresh_catalog.py --validate

      - name: Ensure catalog is normalized
        run: python tools/refresh_catalog.py --check

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install site generator dependency
        run: pip install "markdown>=3.8"

      - name: Regenerate committed blog assets
        run: python scripts/build_blog.py

      - name: Ensure generated site assets are fresh
        run: |
          git diff --exit-code -- site/blog site/visuals
          test -z "$(git status --porcelain -- site/blog site/visuals)"

      - name: Check static internal links
        run: python scripts/check_site_links.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate release metadata
        run: ./scripts/release-check.sh

      - name: Build and validate sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Battletest cold install in a new repository
        run: ./scripts/battletest-new-repo.sh

      - name: Verify bundled lifecycle data is in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("data/model_lifecycle.json") for n in names), names
          print("OK: lifecycle data present in", wheel)
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
