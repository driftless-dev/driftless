name: Publish to PyPI

# Publishes on a GitHub Release using PyPI Trusted Publishing (OIDC) — no API
# token secret required. Configure a trusted publisher for this repo/workflow
# at https://pypi.org/manage/project/driftless/settings/publishing/
#
# Release process: docs/RELEASE.md
on:
  release:
    types: [published]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q --cov-fail-under=78
      - name: Run type and repository checks
        if: matrix.python-version == '3.11'
        run: |
          mypy
          python tools/refresh_catalog.py --validate
          python tools/refresh_catalog.py --check
          python scripts/build_blog.py
          git diff --exit-code -- site/blog site/visuals
          test -z "$(git status --porcelain -- site/blog site/visuals)"
          python scripts/check_site_links.py

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate release metadata
        run: |
          chmod +x scripts/release-check.sh
          ./scripts/release-check.sh --tag "${{ github.event.release.tag_name }}"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
