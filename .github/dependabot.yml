version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Keep examples pinned to the released Action. Dependabot otherwise treats
      # this repository's own v0.3.2 reference as eligible for a floating v1.
      - dependency-name: driftless-dev/driftless
    labels:
      - dependencies
      - github-actions

